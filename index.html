/* Presentation-only layout refinement: core application and event handlers are unchanged. */
.top-inner{justify-content:flex-start;gap:18px;min-height:72px}
.top-inner .brand{order:1;flex:0 0 auto}
.top-inner .demo{order:2;margin-left:auto;flex:0 1 auto;text-align:right;min-width:85px}

.top-inner .account-actions{order:4;flex:0 0 auto}

.panel{max-width:100%}

.student-auth-copy p{letter-spacing:.22em}

.student-auth-panel{padding:24px 30px;min-width:0}
.student-auth-card{padding:29px 32px;border-radius:12px}
.student-auth-card h2{font-size:28px}
.student-auth-card .muted{margin-bottom:17px}
.student-auth-card label{margin-top:12px;margin-bottom:7px}

function resolveFlag(fid){const f=data.flags.find(x=>x.id===fid);if(!f||f.status!=='OPEN')return say('This discrepancy has already been resolved.',true);const notes=el('resolveReason')?.value?.trim();if(!notes)return say('Please document how the discrepancy was checked.',true);f.status='RESOLVED';f.resolution=notes;f.resolvedAt=Date.now();event('DISCREPANCY_RESOLVED',f.space,'OPEN','RESOLVED','Demo Admin',notes,{flagId:fid});closeModal(false);saveResult('Discrepancy marked resolved with an audit entry')}
function validateCorrection(){const id=el('correctSpace')?.value,to=el('correctTo')?.value,when=el('correctAt')?.value,reason=el('correctReason')?.value?.trim();const parsed=Date.parse((when?.length===16?when+':00':when)+'+08:00'),now=Date.now();const t=Number.isFinite(parsed)&&parsed<=now&&now-parsed<1000?now:parsed;if(!isActive(id)||!['occupied','available'].includes(to)||!when||!reason||!Number.isFinite(t)||t>Date.now())return {ok:false,message:'Enter an active space, valid past observation time, and reason.'};
  if(data.bay[id]===to)return {ok:false,message:'The verified status already matches the confirmed record.'};
  const later=data.log.some(e=>e.space===id&&['SPACE_STATUS','CORRECTION'].includes(e.type)&&e.time>t);
  if(later)return {ok:false,message:'Later changes exist for this space. Review and reconcile them before correcting.'};return {ok:true,id,to,when,reason,t,from:data.bay[id]};}
function correctionPreview(){const r=validateCorrection();if(!r.ok)return say(r.message,true);openModal('correction',r)}
function approveCorrection(r){if(!el('ackCorrection')?.checked)return say('Please acknowledge the observed status and audit effect.',true);
  if(data.bay[r.id]!==r.from)return say('Space status changed while reviewing. Reopen verification.',true);
  const later=data.log.some(e=>e.space===r.id&&['SPACE_STATUS','CORRECTION'].includes(e.type)&&e.time>r.t);if(later)return say('A later update was recorded. Reconcile it first.',true);
  const v=transitionBay(r.id,r.to,{actor:'Demo Admin',kind:'CORRECTION',reason:`Observed ${fmt(r.t)}: ${r.reason}`,observationAt:r.t});if(!v.ok)return say(v.message,true);closeModal(false);saveResult(`${r.id} correction approved and audited`)}
function changeSettings(){const cap=Number(el('capacity')?.value),limit=Number(el('threshold')?.value),stale=Number(el('staleMinutes')?.value),queueStale=Number(el('queueStaleMinutes')?.value),facility=el('facility')?.value;
  if(!Number.isInteger(cap)||cap<1||cap>34)return say('Active student-space capacity must be between 1 and 34 for this 34-ID demo.',true);
  if(!(limit>=1&&limit<=99)&&Number.isFinite(limit))return say('Threshold must be between 1 and 99%.',true);
  if(!Number.isFinite(limit)||limit<1||limit>99||!Number.isInteger(stale)||stale<1||stale>1440||!Number.isInteger(queueStale)||queueStale<1||queueStale>1440)return say('Check threshold and freshness-limit fields.',true);
  const inactive=IDS.slice(cap).filter(id=>data.bay[id]==='occupied');if(inactive.length)return say(`Cannot deactivate occupied spaces: ${inactive.join(', ')}. Verify and release them first.`,true);
  const old=`capacity ${data.capacity}, threshold ${data.threshold}%, facility ${data.facility}`;data.capacity=cap;data.threshold=limit;data.staleMinutes=stale;data.queueStaleMinutes=queueStale;data.facility=facility;data.registryApproved=Boolean(el('capacityConfirmed')?.checked);

function pt(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}
function polyFor(id){const group=zname(id),q=QUADS[group],n=+id.slice(2);const [start,end]=ZONES.find(z=>z[0]===group).slice(1),k=n-start,N=end-start+1;
  const [a,b,c,d]=q,t1=(k+.07)/N,t2=(k+.93)/N;if(group==='Upper'||group==='Inner')return [pt(a,b,t1),pt(a,b,t2),pt(d,c,t2),pt(d,c,t1)];return [pt(a,d,t1),pt(b,c,t1),pt(b,c,t2),pt(a,d,t2)]}

function rangeLabel(t,group){const d=new Date(t);if(group==='daily')return new Intl.DateTimeFormat('en-PH',{timeZone:tz,month:'short',day:'numeric',hour:'2-digit',hour12:true}).format(d);if(group==='weekly')return new Intl.DateTimeFormat('en-PH',{timeZone:tz,month:'short',day:'numeric'}).format(d);return new Intl.DateTimeFormat('en-PH',{timeZone:tz,year:'numeric',month:'short'}).format(d)}
function groupKey(t,g){const dt=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(t);const d=Object.fromEntries(dt.map(x=>[x.type,x.value]));if(g==='daily')return `${d.year}-${d.month}-${d.day} ${d.hour}:00`;if(g==='weekly')return `${d.year}-${d.month}-${d.day}`;return `${d.year}-${d.month}`}
function analytics(){const all=data.log.filter(e=>['SPACE_STATUS','CORRECTION','VERIFICATION'].includes(e.type)).slice().reverse();const from={daily:86400000,weekly:7*86400000,monthly:30*86400000}[analyticsGroup];const recent=all.filter(e=>e.time>=Date.now()-from);const groups=new Map();for(const e of recent){const key=groupKey(e.time,analyticsGroup);if(!groups.has(key))groups.set(key,{label:rangeLabel(e.time,analyticsGroup),count:0,last:e.countAfter,at:e.time});const g=groups.get(key);g.count++;g.last=e.countAfter;g.at=e.time}
 const entries=[...groups.values()];const top=Math.max(1,...entries.map(g=>g.count));const queue=data.log.filter(e=>e.type==='CONGESTION'&&e.time>=Date.now()-from);
 const peaks=recent.filter(e=>Number.isFinite(e.countAfter)).sort((a,b)=>b.countAfter-a.countAfter).slice(0,3);
 const observations=recent.filter(e=>Number.isFinite(e.countAfter)).sort((a,b)=>a.time-b.time);
 const trace=observations.length>1?observations.map((e,i)=>[30+i*540/(observations.length-1),184-(Math.max(0,Math.min(data.capacity,e.countAfter))/data.capacity)*152]):[];
 const occupancyPlot=observations.length>=2?`<div class="chart-caption">Confirmed occupied spaces at recorded event times. Gaps between events remain unknown.</div><svg class="occupancy-chart" viewBox="0 0 600 210" role="img" aria-label="${observations.length} recorded occupancy observations"><line x1="30" y1="32" x2="30" y2="186" stroke="#999"/><line x1="30" y1="186" x2="575" y2="186" stroke="#999"/><polyline fill="none" stroke="#C8102E" stroke-width="3" points="${trace.map(p=>p.map(v=>v.toFixed(2)).join(',')).join(' ')}"/>${trace.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#151515"><title>${fmt(observations[i].time)}: ${observations[i].countAfter} occupied</title></circle>`).join('')}</svg>`:'<div class="empty">Not enough confirmed changes for a historical occupancy trend. No invented data shown.</div>';
 return `<div class="tabs" role="group" aria-label="Analytics grouping">${[['daily','Daily / hourly'],['weekly','Weekly / day'],['monthly','Monthly / month']].map(([g,l])=>`<button data-group="${g}" class="${analyticsGroup===g?'active':''}">${l}</button>`).join('')}</div><div class="metrics">${metric('CONFIRMED SPACE CHANGES',recent.filter(e=>e.type!=='VERIFICATION').length,'Event count')}${metric('CONGESTION REPORTS',queue.length,'Submitted records')}${metric('CURRENT OCCUPANCY',`${currentCount()} / ${data.capacity}`,'Derived from live bay statuses')}</div><div class="columns section-gap"><article class="panel"><h2>Recorded status-change history</h2><p class="subtle">Real events only · Bars show recorded status changes per period</p>${entries.length?`<div class="bars">${entries.map(g=>`<div class="bar-row"><span>${esc(g.label)}</span><div class="track"><i style="width:${(g.count/top)*100}%"></i></div><strong>${g.count}</strong></div>`).join('')}</div>`:'<div class="empty">No confirmed changes in the selected period. Historical occupancy cannot be inferred.</div>'}<p class="support">Periods with no records are unobserved, not zero occupancy.</p><h3>Recorded occupied-space observations</h3>${occupancyPlot}</article><article class="panel"><h2>Peak recorded observations</h2>${peaks.length?peaks.map(e=>`<div class="summary-row"><span>${fmt(e.time)}</span><strong>${e.countAfter} occupied</strong></div>`).join(''):'<div class="empty">No change events in the selected period.</div>'}<h3>Entrance-report frequency</h3><div class="summary-row">Low <b>${queue.filter(e=>e.after==='LOW').length}</b></div><div class="summary-row">Moderate <b>${queue.filter(e=>e.after==='MODERATE').length}</b></div><div class="summary-row">Heavy <b>${queue.filter(e=>e.after==='HEAVY').length}</b></div></article></div>`}
let analyticsGroup='daily';
const PILOT=[
 ['accuracy','Space-status accuracy','Proposed adaptation: at least 98% of 100+ independently checked physical student-space observations match confirmed space records.'],
 ['timeliness','Public update timeliness','Proposed adaptation: at least 95% of confirmed space changes appear publicly within 10 seconds when connected.'],
 ['correction','Reliable corrections','All tested corrections require Admin approval, observation time, reason, and before/after audit; no invalid capacity.'],
 ['queue','Queue-report agreement','At least 85% agreement across at least 20 independently observed LOW/MODERATE/HEAVY reports.'],
 ['usability','Student usability','At least 80% of at least 10 student testers identify availability and congestion within five seconds.'],
 ['waiting','Waiting and idling','Compare observed waiting and idling before and during the pilot; no assumed savings or results.']];
function adminReports(){const q=data.log.filter(e=>e.type==='CONGESTION').length;return `<div class="columns"><article class="panel"><h2>Operational report</h2><p class="subtle">Export structured demonstration records: current inventory, timestamps, event history, congestion, corrections and discrepancy resolution.</p><div class="summary-row"><span>Current recorded occupancy</span><strong>${currentCount()} / ${data.capacity}</strong></div><div class="summary-row"><span>Entrance reports</span><strong>${q}</strong></div><div class="summary-row"><span>Admin corrections</span><strong>${data.log.filter(e=>e.type==='CORRECTION').length}</strong></div><button class="button" data-action="export">Export CSV report</button><button class="button outline" data-action="print">Print view</button></article><article class="panel"><h2>Sustainability outcomes</h2><div class="summary-row">Waiting observations <b>Not measured</b></div><div class="summary-row">Idling observations <b>Not measured</b></div><div class="summary-row">Fuel savings <b>Not measured</b></div><div class="summary-row">CO₂ reductions <b>Not measured</b></div><p class="support">No campus impact is claimed from demonstration records.</p></article></div><article class="panel section-gap"><h2>Pilot evaluation · Proposed scope revision B</h2><p class="subtle">Adaptations from the signed proposal require instructor approval. Enter only verified pilot data. No real measurements are included here.</p><div class="pilot-grid">${PILOT.map(([k,name,desc])=>`<div class="pilot"><h3>${esc(name)}</h3><p>${esc(desc)}</p><label>Observed result<input data-pilot="${k}" value="${esc(data.pilot?.[k]??'')}" placeholder="Not yet measured"/></label><span class="support">${data.pilot?.[k]?'Entered pilot note':'Not yet measured'}</span></div>`).join('')}</div><button class="button" data-action="pilot-save">Save evaluation observations</button></article>`}
function adminSettings(){return `<div class="columns"><article class="panel"><h2>Capacity and status settings</h2><p class="subtle">Set active numbered spaces and facility status.</p><div class="form-grid"><label>Active student-space capacity<input id="capacity" type="number" min="1" max="34" value="${data.capacity}"/></label><label>Almost-full threshold (%)<input id="threshold" type="number" min="1" max="99" value="${data.threshold}"/></label><label>Stale space update (minutes)<input id="staleMinutes" type="number" min="1" max="1440" value="${data.staleMinutes}"/></label><label>Stale queue report (minutes)<input id="queueStaleMinutes" type="number" min="1" max="1440" value="${data.queueStaleMinutes}"/></label></div><label>Facility status<select id="facility"><option ${data.facility==='OPEN'?'selected':''}>OPEN</option><option ${data.facility==='CLOSED'?'selected':''}>CLOSED</option></select></label><label class="check"><input type="checkbox" id="capacityConfirmed" ${data.registryApproved?'checked':''}/> Mark registry as physically verified (demo flag)</label><button class="button" data-action="settings">Save facility settings</button></article><article class="panel"><h2>Operating notice</h2><p class="subtle">Notice changes do not falsify the last confirmed space timestamp.</p><label>Public notice<textarea id="noticeText" rows="4">${esc(data.notice)}</textarea></label><button class="button" data-action="notice">Save notice</button><h3>Demo testing</h3><p class="support">Simulate one failed guard submission or restore demo data without confusing this control with a real guard action.</p><button class="button outline" data-action="simulate-failure">Fail next guard save</button><button class="button outline" data-action="reset-demo">Reset demo</button></article></div><article class="panel section-gap"><h2>Verified opening space inventory</h2><p class="subtle">In space-level mode, the verified opening occupancy count is derived from individually checked physical spaces. Selecting a number alone cannot create a trustworthy map.</p><strong>${currentCount()} currently occupied</strong><div class="opening-grid">${activeIds().map(id=>`<label class="opening-check"><input type="checkbox" data-opening-id="${id}" ${data.bay[id]==='occupied'?'checked':''}/>${id}</label>`).join('')}</div><label>Verification method / reason<textarea id="openingReason" rows="2" placeholder="Document the physical walk-through and observation date"></textarea></label><button class="button" data-action="opening-preview">Preview verified opening registry</button></article>`}

async function loadGuards(){if(role!=='admin'||!serverCandidate)return;
 try{const result=await authRequest('/api/guards');guardAccounts=result.guards||[];
   if(adminTab==='guards')render()}
 catch(e){if(e.status!==401)say('Could not load Guard accounts.',true)}
}
function adminGuards(){return `<article class="panel"><div class="split"><div><h2>Security Guard accounts</h2><p class="subtle">Manage authorized guards. Deactivation preserves historical activity records.</p></div><button class="button" data-action="create-guard">Add Guard</button></div>
${syncMode==='local'?`<p class="notice">Account management requires running the shared local server.</p>`:''}
${guardEditor?`<form class="guard-editor" id="guardEditor" onsubmit="return false"><h3>${guardEditor==='new'?'Create Guard account':'Update Guard account'}</h3>
<div class="form-grid"><label>Display name<input id="newGuardName" maxlength="70" value="${esc(guardEditor==='new'?'':guardAccounts.find(x=>x.id===guardEditor)?.name||'')}" placeholder="Guard name" required /></label><label>Username<input id="newGuardUser" maxlength="32" value="${esc(guardEditor==='new'?'':guardAccounts.find(x=>x.id===guardEditor)?.username||'')}" placeholder="guard.lastname" required /></label></div>
<label>${guardEditor==='new'?'Temporary password':'New password (leave blank to keep)'}<input type="password" id="newGuardPass" autocomplete="new-password" minlength="10" placeholder="At least 10 characters" ${guardEditor==='new'?'required':''}/></label>
<div class="modal-actions"><button class="button outline" type="button" data-action="cancel-guard">Cancel</button><button class="button" type="button" data-action="save-guard">${guardEditor==='new'?'Create account':'Save changes'}</button></div></form>`:''}
<div class="table-scroll"><table><thead><tr><th>Name</th><th>Username</th><th>Status</th><th>Last modified</th><th>Actions</th></tr></thead><tbody>${guardAccounts.map(g=>`<tr><td>${esc(g.name)}</td><td>${esc(g.username)}</td><td><span class="status ${g.active?'available':'full'}">${g.active?'Active':'Inactive'}</span></td><td>${fmt(g.updatedAt)}</td><td><button class="mini-control" data-edit-guard="${esc(g.id)}">Edit</button>${g.active?`<button class="mini-control dangerous" data-deactivate-guard="${esc(g.id)}">Deactivate</button>`:`<button class="mini-control" data-restore-guard="${esc(g.id)}">Restore</button>`}</td></tr>`).join('')||`<tr><td colspan="5">No Guard accounts found.</td></tr>`}</tbody></table></div></article>`}
function editGuard(id){if(role!=='admin')return;guardEditor=id;render();el('newGuardName')?.focus()}
async function saveGuard(){if(role!=='admin')return;const name=el('newGuardName')?.value.trim(),username=el('newGuardUser')?.value.trim(),password=el('newGuardPass')?.value||'';
 if(!name||!username||(guardEditor==='new'&&password.length<10))return say('Enter name, username and a temporary password of at least 10 characters.',true);
 if(!serverCandidate)return say('Use the local server to manage Guard accounts.',true);
 try{const body={name,username};if(password)body.password=password;
  const newItem=guardEditor==='new';await authRequest(newItem?'/api/guards':'/api/guards/'+encodeURIComponent(guardEditor),{method:newItem?'POST':'PATCH',body});guardEditor=null;
  await loadGuards();render();say(newItem?'Guard account created.':'Guard account updated.');
 }catch(e){say(e.message,true)}
}
async function deactivateGuard(id){if(role!=='admin')return;if(!confirm('Deactivate this Guard account? Its activity history will be retained.'))return;
 try{await authRequest('/api/guards/'+encodeURIComponent(id),{method:'DELETE'});await loadGuards();say('Guard account deactivated.')}catch(e){say(e.message,true)}
}
async function restoreGuard(id){if(role!=='admin')return;
 try{await authRequest('/api/guards/'+encodeURIComponent(id),{method:'PATCH',body:{active:true}});await loadGuards();say('Guard account restored.')}catch(e){say(e.message,true)}
}
function admin(){if(screen==='login')return signIn();const content={overview:adminOverview,spaces:adminSpaces,verify:adminVerify,flags:adminFlags,logs:adminLogs,congestion:adminCongestion,analytics,reports:adminReports,settings:adminSettings,guards:adminGuards};return `<section class="page"><div class="title"><div><p class="eyebrow">ADMINISTRATOR</p><h1>${esc(ADM_TABS.find(t=>t[0]===adminTab)?.[1])}</h1></div>${statusBadge(data.facility)}</div><div class="admin-layout">${adminNav()}<main class="admin-content">${(content[adminTab]||adminOverview)()}</main></div></section>`}
let lastRenderView='';
function render(){
 const root=el('app');
 if(!root)return;
 const view=[role,screen,guardTab,adminTab,authUser?.id||'guest'].join('|');
 const retain=view===lastRenderView;
 const fields=[];
 let focusKey=null,focusStart=null,focusEnd=null;
 const active=document.activeElement;
 if(retain){
  const items=root.querySelectorAll('input,textarea,select');
  items.forEach((field,index)=>{
   const key=field.id||field.getAttribute('name')||'idx:'+index;
   fields.push({key,index,value:field.value,checked:field.checked,type:field.type});
   if(field===active){focusKey=key;try{focusStart=field.selectionStart;focusEnd=field.selectionEnd}catch{}}
  });
 }
 const sy=window.scrollY;
 root.innerHTML=`<div class="shell">${header()}${role==='student'?student():role==='guard'?guard():admin()}<footer class="footer"><strong>Created by Group TTLDLR: Taruc, Tan, Laguador, Dalog, Lozano, Ruanes - IE103-2-AC2</strong></footer></div>`;
 if(retain&&fields.length){
  const updated=root.querySelectorAll('input,textarea,select');
  fields.forEach(f=>{const n=Array.from(updated).find((node,i)=>((node.id||node.getAttribute('name')||'idx:'+i)===f.key)&&node.type===f.type);if(!n)return;
   if(n.type==='checkbox'||n.type==='radio')n.checked=f.checked;else n.value=f.value;
  });
  if(focusKey!==null){const n=Array.from(updated).find((node,i)=>(node.id||node.getAttribute('name')||'idx:'+i)===focusKey);if(n){n.focus({preventScroll:true});try{if(focusStart!==null)n.setSelectionRange(focusStart,focusEnd)}catch{}}}
 }
 if(retain&&Math.abs(window.scrollY-sy)>4)window.scrollTo(0,sy);
 lastRenderView=view;
 if(el('mapViewport'))attachMapDrag();
}
function openModal(type,payload){lastFocused=document.activeElement;let html='';if(type==='bay'){const id=payload,stat=data.bay[id];html=`<p class="eyebrow">GUARD OBSERVATION</p><h2 id="dialogTitle">${id} · ${zname(id)} section</h2><p>Current confirmed status: <strong>${stat.toUpperCase()}</strong></p><p class="subtle">Confirm only after physically observing this exact space.</p><div class="modal-actions"><button class="button outline" data-action="modal-close">Cancel</button><button class="button dark" data-set="available" data-space="${id}" ${stat==='available'?'disabled':''}>Mark available</button><button class="button" data-set="occupied" data-space="${id}" ${stat==='occupied'?'disabled':''}>Mark occupied</button></div>`}
 if(type==='correction'){const r=payload;html=`<p class="eyebrow">ADMIN APPROVAL</p><h2 id="dialogTitle">Review correction · ${r.id}</h2><dl class="approval"><dt>Current record</dt><dd>${r.from}</dd><dt>Physically observed</dt><dd>${r.to}</dd><dt>Observed at</dt><dd>${fmt(r.t)}</dd><dt>Reason</dt><dd>${esc(r.reason)}</dd></dl><label class="check"><input type="checkbox" id="ackCorrection"/> I have reviewed the physical evidence and audit effect.</label><div class="modal-actions"><button class="button outline" data-action="modal-close">Cancel</button><button class="button" data-action="correction-approve">Approve correction</button></div>`}
 if(type==='resolve'){const f=data.flags.find(f=>f.id===payload);html=`<p class="eyebrow">DISCREPANCY REVIEW</p><h2 id="dialogTitle">${f?.space} · Resolve report</h2><p class="subtle">${esc(f?.reason)}</p><label>Resolution notes<textarea id="resolveReason" rows="3" placeholder="Describe the check and outcome"></textarea></label><div class="modal-actions"><button class="button outline" data-action="modal-close">Cancel</button><button class="button" data-action="resolve-confirm">Mark resolved</button></div>`}
 if(type==='opening'){html=`<p class="eyebrow">PHYSICAL INVENTORY APPROVAL</p><h2 id="dialogTitle">Confirm verified opening</h2><p><strong>${payload.ids.length}</strong> physically observed occupied spaces out of <strong>${data.capacity}</strong> active IDs.</p><p class="subtle">This will reconcile selected space statuses and create auditable correction records.</p><label class="check"><input type="checkbox" id="ackOpening"/> I verified the selected space IDs on site (demo assertion).</label><div class="modal-actions"><button class="button outline" data-action="modal-close">Cancel</button><button class="button" data-action="opening-approve">Approve snapshot</button></div>`}
 modal={type,payload};el('dialogRoot').innerHTML=`<div class="modal-back" data-backdrop="true"><section role="dialog" aria-modal="true" aria-labelledby="dialogTitle" class="modal" tabindex="-1">${html}</section></div>`;el('dialogRoot').querySelector('.modal')?.focus();}
function closeModal(restore=true){modal=null;el('dialogRoot').innerHTML='';if(restore)lastFocused?.focus?.()}
function exportCSV(){const rows=[];const add=(...arr)=>rows.push(arr);add('SECTION','DATE_ISO_UTC','DATE_MANILA','EVENT_ID','SPACE','ACTION','BEFORE','AFTER','ACTOR','COUNT_AFTER','REMARKS');add('SUMMARY',iso(Date.now()),fmt(Date.now()),'—','—','Current occupancy',currentCount(),data.capacity,'Demo Admin',currentCount(),`Available ${available()} / ${availStatus()}`);
 for(const e of data.log)add('EVENT',iso(e.time),fmt(e.time),e.id,e.space,humanEvent(e),e.before,e.after,e.actor,e.countAfter??'',e.note);
 for(const f of data.flags)add('DISCREPANCY',iso(f.at),fmt(f.at),f.id,f.space,f.issue,f.status,f.resolution||'',f.openedBy,'',f.reason);
 for(const q of data.queueHistory)add('QUEUE',iso(q.at),fmt(q.at),'—','—','Reported',q.value,'','Demo Guard','','');
 for(const [key,name,description] of PILOT)add('PILOT_EVALUATION','','',key,'—',name,'Not yet measured',data.pilot?.[key]||'Not yet measured','Demo Admin','',description);
 add('FACILITY','','','—','—','Operating status',data.facility,'capacity '+data.capacity,'Demo Admin',currentCount(),'Scope revision B, unverified physical bay registry');
 const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a'),url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='ParkPulse_Revision_B_Demo_Report.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);say('Structured demonstration report exported.');}
function attachMapDrag(){const box=el('mapViewport');if(!box)return;let drag=null;box.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,x0:mapX,y0:mapY};box.setPointerCapture(e.pointerId)});box.addEventListener('pointermove',e=>{if(!drag)return;mapX=drag.x0+e.clientX-drag.x;mapY=drag.y0+e.clientY-drag.y;applyMapTransform()});box.addEventListener('pointerup',()=>drag=null);box.addEventListener('pointercancel',()=>drag=null);box.addEventListener('keydown',e=>{const d=28;if(e.key==='ArrowLeft')mapX-=d;else if(e.key==='ArrowRight')mapX+=d;else if(e.key==='ArrowUp')mapY-=d;else if(e.key==='ArrowDown')mapY+=d;else return;e.preventDefault();applyMapTransform()})}
function applyMapTransform(){const p=el('mapPan');if(p)p.style.transform=`translate(${mapX}px,${mapY}px) scale(${mapScale})`}
function click(e){const t=e.target.closest('[data-admin],[data-guard],[data-zone],[data-select],[data-queue],[data-action],[data-set],[data-resolve],[data-group],[data-edit-guard],[data-deactivate-guard],[data-restore-guard]');if(!t)return;
 if(t.dataset.editGuard)return editGuard(t.dataset.editGuard);if(t.dataset.deactivateGuard)return deactivateGuard(t.dataset.deactivateGuard);if(t.dataset.restoreGuard)return restoreGuard(t.dataset.restoreGuard);if(t.dataset.admin){adminTab=t.dataset.admin;if(adminTab==='guards')loadGuards();return render()}if(t.dataset.guard){guardTab=t.dataset.guard;return render()}if(t.dataset.zone){zone=t.dataset.zone;return render()}
 if(t.dataset.group){analyticsGroup=t.dataset.group;return render()}if(t.dataset.select)return openModal('bay',t.dataset.select);
 if(t.dataset.set){const id=t.dataset.space,to=t.dataset.set;return submitGuard(id,to)}if(t.dataset.queue)return queueReport(t.dataset.queue);
 if(t.dataset.resolve)return openModal('resolve',t.dataset.resolve);
 const a=t.dataset.action;if(!a)return;
 if(a==='zoom-in'||a==='zoom-out'){mapScale=Math.min(3,Math.max(1,+(mapScale+(a==='zoom-in'?0.3:-0.3)).toFixed(2)));return applyMapTransform()}
 if(a==='zoom-reset'){mapScale=1;mapX=0;mapY=0;return applyMapTransform()}
 if(a==='modal-close')return closeModal();if(a==='start-shift'){data.shift=true;return saveResult('Demo shift started')}
 if(a==='sign-in')return loginPortal('staff');
 if(a==='student-sign-in')return loginPortal('student');
 if(a==='sign-out')return signOut();
 if(a==='create-guard')return editGuard('new');
 if(a==='cancel-guard')return (guardEditor=null,render());
 if(a==='save-guard')return saveGuard();
 if(a==='flag')return submitFlag();if(a==='correction-preview')return correctionPreview();if(a==='correction-approve')return approveCorrection(modal?.payload);
 if(a==='resolve-confirm')return resolveFlag(modal?.payload);if(a==='settings')return changeSettings();if(a==='notice')return saveNotice();
 if(a==='opening-preview')return verifiedOpening();if(a==='opening-approve')return approveOpening(modal?.payload);
 if(a==='export')return exportCSV();if(a==='print')return window.print();if(a==='pilot-save'){for(const i of document.querySelectorAll('[data-pilot]'))data.pilot[i.dataset.pilot]=i.value.trim()||null;event('PILOT_NOTE','—','—','Saved','Demo Admin','Unverified pilot observation notes');return saveResult('Pilot notes saved; not automatically scored')}
 if(a==='simulate-failure'){nextFail=true;return say('Next Guard save will fail without changing any confirmed data')}
 if(a==='reset-demo'){if(!confirm('Reset all demonstration records and settings?'))return;data=seed();statusChip='Ready';nextFail=false;return saveResult('Demo returned to initial data')}
}
document.addEventListener('click',e=>{if(e.target.matches('[data-backdrop]'))return closeModal();click(e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){e.preventDefault();closeModal()}if(modal&&e.key==='Tab'){const fs=[...el('dialogRoot').querySelectorAll('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled)')];if(!fs.length)return;const i=fs.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();fs.at(-1).focus()}else if(!e.shiftKey&&i===fs.length-1){e.preventDefault();fs[0].focus()}}});
// Refresh relative labels periodically without redefining the status. Avoid resetting focused inputs.
setInterval(()=>{if(!modal&&!['admin'].includes(role)&&!document.activeElement?.matches('input,textarea,select'))render()},60000);
setInterval(()=>{if(syncMode==='live')pollRemote();else if(syncMode==='disconnected')initRemote()},650);
window.addEventListener('focus',()=>{if(syncMode==='live')pollRemote();else if(serverCandidate)initRemote()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&syncMode==='live')pollRemote()});
document.addEventListener('focusout',()=>{if(deferredRender)setTimeout(()=>{if(!document.activeElement?.matches('input,textarea,select')){deferredRender=false;render()}},25)});
render();initRemote();
